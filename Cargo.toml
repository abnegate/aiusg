[package]
name = "aiusg"
version = "0.5.0"
edition = "2024"
description = "One place to see usage limits and reset times across all your AI provider accounts"
license = "MIT"
repository = "https://github.com/abnegate/aiusg"
readme = "README.md"
keywords = ["claude", "codex", "copilot", "usage", "cli"]
categories = ["command-line-utilities", "development-tools", "api-bindings"]
rust-version = "1.88"
include = ["src/**/*", "tests/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[[bin]]
name = "aiusg"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = [
    "login",
    "keychain",
    "copilot",
    "cursor",
    "grokbot",
    "dep:clap",
    "dep:crossterm",
    "dep:rmcp",
    "dep:schemars",
    "dep:futures",
    "tokio/rt-multi-thread",
]
login = [
    "dep:webbrowser",
    "dep:rand",
    "dep:sha2",
    "dep:url",
    "tokio/net",
    "tokio/io-util",
    "tokio/time",
]
keychain = ["dep:keyring", "dep:sha2"]
copilot = ["dep:rusqlite"]
cursor = ["dep:rusqlite", "dep:url"]
grokbot = ["cursor"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"], optional = true }
crossterm = { version = "0.29.0", optional = true }
dirs = "7.0.0"
futures = { version = "0.3.34", optional = true }
keyring = { version = "4.2.0", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls", "gzip", "http2", "charset", "system-proxy"] }
rand = { version = "0.10.2", optional = true }
rmcp = { version = "3.2.*", features = ["transport-io"], optional = true }
schemars = { version = "1.1.*", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", optional = true }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
url = { version = "2.5.8", optional = true }
webbrowser = { version = "1.2.4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.2.0", features = ["windows-native-keyring-store"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.2.0", features = ["dbus-secret-service-keyring-store"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt", "net", "io-util", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
